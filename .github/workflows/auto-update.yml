name: EduSmart CI Auto-Update SOPHIA

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  generate-courses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install openai --quiet
          
      - name: Generate 3 new courses
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python agents/generate.py --count 3
          
      - name: Commit and push
        run: |
          git config user.name "SOPHIA Bot"
          git config user.email "sophia@edusmart.ci"
          git add courses.json
          git diff --staged --quiet || git commit -m "Auto SOPHIA: +3 cours - $(date +%Y-%m-%d)"
          git push
          
      - name: Trigger Netlify deploy
        if: always()
        env:
          NETLIFY_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_HOOK" ]; then curl -X POST $NETLIFY_HOOK; else echo "No hook"; fi
