## Introduction Ivoirienne
Jus de citron (acide) à Adjame vs cendre potasse (basique) pour foutou. Corps humain sang pH=7,4 tamponné. Si trop acide = acidose, comme sauce graine trop aigre.

## Définitions Bronsted
- Acide = donneur H+, Base = accepteur H+
- Couple Acide/Base: AH ⇌ A- + H+ . Ka = [A-][H+]/[AH]; pKa = -log Ka.
- Acide fort totalement dissocié: HCl, H2SO4 première, HNO3. Base forte NaOH, KOH.
- Faible partiellement dissocié: CH3COOH, NH4+
- Eau ampholyte: Ke=[H+][OH-]=10^-14 à 25°C, pKe=14. pH=-log[H+], pOH...
- Relation Henderson: pH = pKa + log ( [B]/[A] )
- Tampon: mélange acide faible + base conjuguée, pH peu varie.

## Dosage BAC D - Incontournable
- Acide fort + base forte: à équivalence pH=7, V_eq = Ca Va / Cb. Courbe symétrique.
- Acide faible + base forte: équivalence pH>7 basique (anion base faible). Demi-équivalence pH=pKa! Méthode très demandée.
- Choix indicateur coloré: zone virage contient pHeq. Hélianthine 3,1-4,4 acide; BBT 6-7,6; phénolphtaléine 8,2-10 basique.

## Formules
- [H+]= 10^{-pH}
- Acide fort Ca = [H+], pH=-log Ca
- Base forte Cb = [OH-], pH=14+log Cb
- Acide faible: [H+] = √(Ka Ca) si peu dissocié.

## Schéma Dosage
<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#fff"/>
  <line x1="40" y1="160" x2="380" y2="160" stroke="black"/><line x1="40" y1="20" x2="40" y2="160" stroke="black"/>
  <path d="M 45 40 L 150 45 L 180 90 L 210 140 L 350 145" fill="none" stroke="blue" stroke-width="2"/>
  <circle cx="180" cy="90" r="4" fill="red"/><text x="190" y="85">E: pH 8,8</text>
  <text x="10" y="30">pH</text><text x="200" y="175">V base</text>
  <text x="100" y="20">Acide faible + base forte</text>
</svg>

## Exemple Résolu 1 - pH vinaigre
Acide acétique 0,1M Ka=1,8e-5, pKa=4,74. [H+]=√(Ka Ca)=√1,8e-6=1,34e-3 => pH=2,87 acide comme bissap fermenté.

## Exemple Résolu 2 - Dosage BAC 2023
On dose 20mL CH3COOH 0,1M par NaOH 0,1M. Veq=20mL. À demi-équivalence V=10mL pH=pKa=4,75 mesure. À équivalence pH=8,8. Indicateur adapté = phénolphtaléine.

## Exercices Corrigés
Ex1: pH de HCl 0,01M =2. pH de NaOH 0,01M: [OH]=0,01 => pOH=2 => pH=12.
Ex2: Solution tampon sang: H2CO3/HCO3- pKa=6,1 ratio 1/20 => pH=6,1+log20≈7,4.

## Astuce BAC
- À demi-équivalence pH=pKa => méthode pour déterminer pKa expérimentalement.
- Pour acide fort/base forte, utilise C1V1=C2V2 à l'équivalence.
- Ne jamais oublier Ke=10^-14 pour lier H+ et OH-.
- Si on mélange acide fort + faible, fort impose pH.
`,duree:"60 min",difficulte:"Difficile",images:["schema_dosage_pH","schema_couple_acide_base"],status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Théorème de Pythagore et sa réciproque",niveau:"4e",matiere:"Maths",chapitre:"Pythagore",contenu:{introduction_ivoirienne:"À Abidjan, pour vérifier si l'angle d'une parcelle à Cocody est droit, les géomètres utilisent la méthode 3-4-5 héritée de Pythagore. Sans équerre, avec seulement une corde, ils mesurent 3m d'un côté, 4m de l'autre, et doivent trouver 5m en diagonale. Pourquoi 3-4-5 garantit un angle droit ? C'est Pythagore. Ce théorème est essentiel au BEPC.",definitions:"Triangle rectangle : triangle ayant un angle de 90°. Hypoténuse : côté opposé à l'angle droit, c'est le plus grand côté. Théorème de Pythagore : Dans un triangle rectangle, le carré de l'hypoténuse est égal à la somme des carrés des deux autres côtés. Réciproque : Si dans un triangle le carré du plus grand côté = somme des carrés des deux autres, alors le triangle est rectangle.",formules:"Si ABC rectangle en A: BC² = AB² + AC². Donc BC = sqrt(AB²+AC²). AB = sqrt(BC²-AC²). Réciproque: Si BC² == AB²+AC² alors ABC rectangle en A.",schema:"Triangle ABC rectangle en A. Marquer angle droit en A. Hypoténuse BC horizontale en bas. Carrés construits sur chaque côté. Flèche: AB = 3cm (côté vertical), AC = 4cm (horizontal), BC = 5cm (hypoténuse). Notation: petit carré pour angle droit.",exemples_resolus:["Exemple 1 (Calcul hypoténuse): ABC rectangle en A, AB=6cm, AC=8cm. BC²=6²+8²=36+64=100 => BC=10cm.","Exemple 2 (Calcul côté): MNP rectangle en M, NP=13cm (hypoténuse), MP=5cm. MN²=NP²-MP²=169-25=144 => MN=12cm.","Exemple 3 (Réciproque): Triangle à Yopougon: côtés 5,12,13. 13²=169, 5²+12²=25+144=169 => 169=169 donc rectangle."],exercices_corriges:["Ex1: EFG rectangle en E, EF=9, EG=12, calcule FG. Corrigé: FG²=81+144=225 => FG=15.","Ex2: Un poteau électrique de 8m projette ombre? Une échelle de 10m appuyée à 6m du mur, quelle hauteur atteint-elle? Corrigé: h = sqrt(10²-6²)=sqrt(64)=8m.","Ex3: Vérifie si triangle 7-24-25 est rectangle. 25²=625, 7²+24²=49+576=625 oui rectangle."],astuce:"BEPC Astuce: Retiens triplets pythagoriciens 3-4-5, 5-12-13, 6-8-10, 9-12-15. Très fréquents. Pour rédiger: toujours écrire 'D'après Pythagore' + formule + calcul + conclusion. Pour réciproque: commence par le plus grand côté."},id:244,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"La dissertation en 4e: méthodologie",niveau:"4e",matiere:"Français",chapitre:"Dissertation",contenu:{introduction_ivoirienne:"Sujet BEPC: 'La tradition est-elle un frein au développement?' Sujet d'actualité en Côte d'Ivoire entre modernité d'Abidjan et valeurs village du Gblo. Dissertation = argumenter pas raconter.",definitions:"Dissertation: exercice argumentatif logique. Thèse (point de vue), antithèse (limites), synthèse (dépassement). Introduction (amener sujet, problématique, plan), Développement (2-3 parties avec arguments + exemples), Conclusion (bilan réponse).",formules:"Structure intro: Phrase d'accroche (citation/proverbe ivoirien) + reformulation sujet + problématique + annonce plan. Connecteurs: D'abord, ensuite, en outre, cependant, par conséquent.",schema:"Plan dialectique: I Thèse: Oui tradition frein (ex: excision, mariages forcés). II Antithèse: Non tradition richesse (solidarité, respect aînés). III Synthèse: Concilier.",exemples_resolus:["Sujet: Faut-il préférer livre au portable? Intro: A l'ère smartphone... Problématique: livre est-il dépassé? Plan: I avantages portable, II livre irremplaçable, III complémentarité.","Paragraphe modèle: Argument: Le théâtre ivoirien enseigne. Exemple: les pièces de Bernard Dadié dénoncent colonisation. Explication."],exercices_corriges:["Rédige intro pour 'La science peut-elle faire le bonheur?' Corrigé: Accroche 'Science sans conscience...' Rabelais, problématique, plan.","Trouve 2 arguments pour 'L'argent fait-il le bonheur?' Corrigé: Oui sécurité, éducation; Non santé, amour pas achetable."],astuce:"BEPC astuce: 3 parties = 3 paragraphes, chacun 1 idée + 1 exemple ivoirien (ex: FHB, Ake Loba, cacao). Évite 'je pense', dis 'il semble'. 250 mots minimum."},id:245,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Le théâtre: genres et analyse",niveau:"4e",matiere:"Français",chapitre:"Théâtre",contenu:{introduction_ivoirienne:"Au MASA d'Abidjan, pièce de Werewere Liking ou de Souleymane Koly? Théâtre ivoirien = cotouklou théâtre, cri, danse. Mais bases: comédie, tragédie, drame, héritées de Molière et modernes.",definitions:"Théâtre: texte destiné à être joué. Réplique, tirade, didascalie (indication scène), acte, scène. Genres: Comédie (faire rire), Tragédie (destin fatal, mort héros), Drame (mélange), Farce. Personnages: protagonist, antagoniste.",formules:"Schéma acte: Exposition, Nœud, Péripéties, Dénouement. Règle des 3 unités classique: temps, lieu, action.",schema:"Scène de théâtre ivoirien: Plateau, coulisses, public, acteurs avec masques. Texte: NOM: réplique (didascalie entre parenthèses).",exemples_resolus:["Analyse: 'Béatrice du Congo' - tragédie historique, héroïne se sacrifie, fatalité colonisation.","Comique: calembour, quiproquo, comique de geste (comme Adama Dahico)."],exercices_corriges:["Identifie didascalie: 'Kouadio (en colère, s'approchant): ...' Corrigé: 'en colère, s'approchant' = didascalie.","Distingue comédie/tragédie: pièce se termine par mariage joyeux => comédie."],astuce:"Pour BEPC, si on te donne extrait théâtre, repère: didascalies en italique/parenthèses, type comique, registre, et fonction: divertir, dénoncer, enseigner. Cite théâtre ivoirien: Bernard Zadi Zaourou."},id:246,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"L'argumentation",niveau:"4e",matiere:"Français",chapitre:"Argumentation",contenu:{introduction_ivoirienne:"Ton père dit 'pas de sortie', tu argumentes. Président débat cacao. Argumenter = convaincre avec raisons, pas crier. Essentiel pour dissertation et débat BEPC.",definitions:"Thèse: opinion défendue. Argument: raison qui soutient thèse. Exemple: fait concret qui illustre argument. Connecteurs logiques: cause (car, parce que), conséquence (donc, ainsi), opposition (mais, toutefois), addition (de plus). Types: argument logique, d'autorité, par exemple, par analogie.",formules:"Structure argumentative: Thèse -> Argument 1 (exemple ivoirien) + Argument 2 + Argument 3 -> Conclusion. Connecteurs à maîtriser.",schema:"Pyramide: Thèse en haut, 3 arguments piliers, exemples base.",exemples_resolus:["Thèse: Il faut préserver forêt ivoirienne. Arg1: poumon climatique (ex: pluie). Arg2: biodiversité (éléphants). Arg3: économie cacao durable.","Contre-argument: Mais exploitation bois nécessaire? Réfutation: tourisme éco rapporte plus."],exercices_corriges:["Trouve argument pour 'Port uniforme scolaire': Arg: égalité sociale, discipline, économie famille.","Ajoute connecteur: 'Le téléphone est utile ___ il peut distraire' => mais / cependant"],astuce:"Utilise exemples locaux: FHB, lagune, attiéké, CAN 2023, pour marquer correcteur BEPC. Évite hors sujet. Un paragraphe = un argument + un exemple."},id:247,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Passive Voice – Voix passive",niveau:"4e",matiere:"Anglais",chapitre:"Passive",contenu:{introduction_ivoirienne:"On dit 'Le cacao est cultivé en Côte d'Ivoire' pas 'Les paysans cultivent...' On s'intéresse au cacao, pas qui cultive. Comme RTI: 'Route construite par...'",definitions:"Active: Sujet fait action. Passive: Sujet subit action. Formation: to be au temps de l'actif + past participle. Objectif: focus sur objet, quand auteur inconnu, formel.",formules:"Present simple passive: is/are + pp: Cacao is grown. Past: was/were + pp: School was built in 1960. Future: will be + pp. Present perfect: has been + pp. Modal: can be + pp. by + agent si important.",schema:"Transformation: Active: Farmers (S) grow (V) cacao (O) => Passive: Cacao (O devient S) is grown (be+pp) by farmers.",exemples_resolus:["Active: They produce attiéké in Abidjan => Passive: Attiéké is produced in Abidjan.","They built N'Zassa bridge in 2022 => Bridge was built in 2022.","They will finish stadium => Stadium will be finished."],exercices_corriges:["They speak French in Côte d'Ivoire => French is spoken...","Someone stole my phone at Adjame => My phone was stolen...","They have planted many trees => Many trees have been planted."],astuce:"BEPC astuce: Repère temps actif, garde même temps en passif. Objet devient sujet. Ajoute by seulement si qui important. Si sujet actif = they/people/someone, supprime by."},id:248,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"La traite négrière et ses conséquences",niveau:"4e",matiere:"Histoire",chapitre:"Traite négrière",contenu:{introduction_ivoirienne:"Sur la côte ivoirienne, à Grand-Bassam, Assinie, des forts négriers. Pourquoi les Portugais puis Français venaient-ils? La traite atlantique a dépeuplé l'Afrique 400 ans. Côte d'Ivoire aussi touchée.",definitions:"Traite négrière: commerce d'esclaves africains. Trois formes: transsaharienne, orientale, atlantique (triangulaire). Commerce triangulaire: Europe -> Afrique (pacotille, armes), Afrique -> Amérique (esclaves), Amérique -> Europe (sucre, coton).",formules:"Dates clés: 1441 premiers esclaves, 1562 début anglais, 1807 abolition Angleterre, 1848 abolition France (Schœlcher). Chiffres: ~12 millions déportés Atlantique.",schema:"Triangle: Europe (haut), Afrique (bas gauche), Amérique (bas droite). Flèches avec produits. Forts ivoiriens: Assinie, Grand-Bassam.",exemples_resolus:["Causes: besoin main d'œuvre plantations Amérique, profit, armes contre esclaves.","Organisation: capture intérieure, marche vers côte, baraquons, traversée Middle Passage 20% morts.","Conséquences Afrique: dépeuplement, guerres, retard tech."],exercices_corriges:["Cite 2 forts en Côte d'Ivoire? Assinie, Grand-Bassam, Sassandra.","Explique commerce triangulaire en 3 lignes: Europe apporte... Afrique donne... Amérique renvoie...","Conséquence culturelle: diaspora afro-américaine, jazz, vaudou."],astuce:"BEPC: Toujours citer abolitionnistes: Toussaint Louverture (Haïti), Victor Schœlcher (France). Carte triangle obligatoire. Lie à Côte d'Ivoire: royaumes Baoulé, Attié résistaient."},id:249,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"La Première Guerre mondiale 1914-1918",niveau:"4e",matiere:"Histoire",chapitre:"Première Guerre mondiale",contenu:{introduction_ivoirienne:"En 1914, des tirailleurs ivoiriens forcés partir en France: 'Banane' pas leur guerre. Pourquoi Côte d'Ivoire impliquée? Colonie française.",definitions:"Triple Alliance (Allemagne, Autriche, Italie) vs Triple Entente (France, Angleterre, Russie). Détente: assassinat Sarajevo 28 juin 1914. Guerre tranchées, guerre totale, tirailleurs sénégalais (incluant Ivoiriens).",formules:"Chronologie: 28 juin 1914 attentat Franz Ferdinand, 1914-1918 guerre, 1916 Verdun/Somme, 1917 entrée USA, 11 nov 1918 armistice, 28 juin 1919 Traité Versailles.",schema:"Frise 1914-1918 avec deux fronts: Ouest (France), Est (Russie). Photo tirailleur ivoirien, tranchée.",exemples_resolus:["Causes: rivalités coloniales, nationalisme, course armements, système alliances.","Vie tranchées: boue, rats, gaz, 10M morts.","Rôle Afrique: 200 000 tirailleurs, dont Ivoiriens, promesse indépendance non tenue."],exercices_corriges:["Pourquoi guerre mondiale? Parce que colonies impliquées -> recrutement africain.","Bilan: 10M morts, empires détruits (Allemand, Ottoman), création SDN, crise économique.","Traité Versailles punit Allemagne => cause 2e guerre."],astuce:"BEPC: Retiens 3C causes: Concurrence, Colonies, Conflit alliances. Cite tirailleurs = point ivoirien important. Date Armistice 11 novembre férié aussi en CI?"},id:250,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Géopolitique du monde actuel: Côte d'Ivoire dans le monde",niveau:"4e",ma act à Adjame = incendie."],exercices_corriges:["Calcule énergie frigo 200W 24h: E=0.2kW*24=4.8 kWh. Facture CIE 4.8*87F=417F.","Fusible 10A, peut-il supporter 2000W chauffe-eau sous 220V? I=2000/220=9.09A <10A oui mais limite.","Rôle prise terre: évacue courant fuite carcasse métallique => évite électrocution."],astuce:"Sécurité BEPC: Eau + électricité = mort, jamais mains mouillées. Ne pas surcharger multiprise. 220V Côte d'Ivoire dangereux. Terre obligatoire. Fusible protège installation, disjoncteur protège personnes."},id:253,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Lois chimiques – Conservation et équations",niveau:"4e",matiere:"Physique",chapitre:"Lois Chimie",contenu:{introduction_ivoirienne:"Quand on brûle charbon pour attiéké, fumée disparaît mais rien ne se perd? Lavoisier loi. Comme marché: si tu as 5 kg igname, tu revends 5 kg, conservation.",definitions:"Loi Lavoisier: masse se conserve rien ne se perd tout se transforme. Loi Proust proportions définies. Équation bilan équilibrée avec coefficients stoechiométriques. Réactifs -> Produits. Moles, conservation atomes.",formules:"Equilibrer: ex CH4 +2 O2 -> CO2 +2 H2O. Compter: C 1=1, H 4=4, O 4=4. Masse réactifs = masse produits.",schema:"Balance: réactifs plateau gauche, produits droite même masse. Modèle moléculaire boules.",exemples_resolus:["Combustion butane gaz cuisine CI: 2 C4H10 +13 O2 ->8 CO2+10 H2O. Equilibrage étapes.","Masse: 12g carbone +32g O2 ->44g CO2. Conservation: 12+32=44.","Fer rouille à Abidjan humide: 4Fe+3O2->2Fe2O3"],exercices_corriges:["Equilibre: Fe + O2 -> Fe2O3 => 4Fe+3O2->2Fe2O3","Si 10g C brûle, masse CO2? Calcul moles: 10/12=0.833 mol C => 0.833 mol CO2 => 0.833*44=36.66g","BEPC: Pourquoi masse bûche diminue brûlant? Produits gazeux (CO2, vapeur) s'échappent mais masse totale conserve."],astuce:"Méthode équilibrage: commence métaux, puis C,H, puis O à la fin, finis par H2O si besoin. Toujours vérifier atomes. Retiens Lavoisier 1789 phrase exacte pour BEPC."},id:254,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Réactions chimiques – Types en 4e",niveau:"4e",matiere:"Physique",chapitre:"Réactions",contenu:{introduction_ivoirienne:"Bouillie de mil aigre après 2 jours? Fermentation. Eau de javel + vinaigre ça mousse? Acide-base. Pile citron à Grand-Bassam marché science.",definitions:"Réaction acide-base: acide (pH<7) + base (pH>7) -> sel + eau. Ex HCl + NaOH -> NaCl + H2O. Réaction oxydoréduction: échange oxygène/électrons, combustion, rouille. Précipitation: solide se forme. Effervescence CO2.",formules:"pH: 0-7 acide, 7 neutre, 7-14 basique. Neutralisation: H+ + OH- -> H2O. Combustion HC: CxHy + O2 -> CO2 + H2O. Tests: CO2 trouble eau de chaux, H2 pète.",schema:"Tube à essai: acide + base avec indicateur BBT: jaune acide, vert neutre, bleu base. Combustion bougie: suie, buée.",exemples_resolus:["Vinaigre (acide acétique) + bicarbonate soude (base) => CO2 qui gonfle ballon (expérience fête). Equation: CH3COOH+NaHCO3->CH3COONa+CO2+H2O","Test eau de chaux: souffle dans eau chaux -> trouble = CO2 présent, preuve respiration.","Rouille: fer + eau + O2 -> rouille brune, pourquoi port Abidjan rouille vite (sel+humidité)."],exercices_corriges:["Identifie type: Soude + acide chlorhydrique => acide-base.","Pourquoi citron allume lampe? Acide conducteur, réaction redox avec métaux pile.","Équilibre: Zn +2HCl -> ZnCl2 + H2 test dihydrogène pop."],astuce:"BEPC: Tests caractéristiques obligatoires: Eau chaux pour CO2, BBT pour acide-base, buée pour H2O, sulfate cuivre anhydre bleu→blanc pour eau, tison pour O2 ravive flamme. Sécurité: jamais acide dans eau brute, toujours acide dans eau doucement."},id:255,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Mécanique – Forces et mouvements",niveau:"4e",matiere:"Physique",chapitre:"Mécanique",contenu:{introduction_ivoirienne:"Gbaka freine brusquement, tu pars devant: inertie. Pousser pirogue à Grand-Lahou: action-réaction. Pourquoi ballon Au marché de Treichville, Maman Adjoua partage 3 pains attiéké entre 4 enfants. Comment écrire la part de chacun? Les fractions sont partout en Côte d'Ivoire: partage de terrain, de récolte de cacao, de facture Orange Money.

## Objectifs (APC - Programme officiel CI 5e)
- Comprendre la notion de fraction
- Comparer, simplifier, additionner, soustraire, multiplier, diviser des fractions
- Résoudre des problèmes concrets

## Définitions
- Fraction: a/b avec a numérateur, b dénominateur non nul (b ≠ 0). Ex: 3/4
- Fractions équivalentes: a/b = (a*k)/(b*k)
- Fraction irréductible: PGCD(num, den) = 1
- Inverse de a/b = b/a

## Formules essentielles
- Simplification: a/b = (a÷k)/(b÷k)
- Comparaison: si même dénominateur, plus grand numérateur = plus grande. Sinon produits en croix: a/b ? c/d => a*d ? c*b
- Addition/soustraction même déno: a/b ± c/b = (a±c)/b
- Dénos différents: a/b + c/d = (ad+cb)/bd
- Multiplication: a/b * c/d = ac/bd
- Division: (a/b) ÷ (c/d) = a/b * d/c

## Schéma (description)
Droite graduée 0 à 2. Place 1/2, 3/4, 5/4. Rectangle partagé en 4, 3 coloriés = 3/4. Camembert: partage en 8, 3 parts = 3/8.

## Exemples résolus
Ex1: Simplifie 12/18. PGCD=6 => 12/18 = 2/3
Ex2: Compare 5/6 et 7/9. 5*9=45, 7*6=42 => 45>42 donc 5/6 > 7/9
Ex3: Calcule 2/3 + 1/6 = 4/6+1/6=5/6
Ex4: Problème marché: Yao a 3/4 sac de riz, il donne 1/3 à son voisin. Reste? 3/4 -1/3 =9/12-4/12=5/12
Ex5: 2/5 * 15/8 =30/40=3/4

## Exercices corrigés
Ex1: Effectue 7/8 - 3/8 =4/8=1/2. Corrigé: 4/8 simplifiable par 4 =>1/2
Ex2: 3/4 + 2/5 =15/20+8/20=23/20=1+3/20
Ex3: Un champ de cacao: 2/3 déjà désherbé, 1/4 de ce qui reste fait aujourd'hui. Quelle fraction totale? Solution: reste 1/3, 1/4*1/3=1/12, total 2/3+1/12=9/12=3/4
Ex4: Range: 1/2, 3/5, 5/8. Dénominateur commun 40: 20/40,24/40,25/40 => 1/2<3/5<5/8

## Astuce BEPC
Toujours simplifier AVANT de multiplier: barre les facteurs communs. Et utilise le produit en croix pour comparer vite sans calculatrice. Réviser PGCD.`,id:257,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Nombres relatifs - Addition, soustraction, repérage",niveau:"5e",matiere:"Mathématiques",chapitre:"Nombres relatifs",contenu:`# Introduction ivoirienne
À Korhogo la nuit il fait 18°C, à Abidjan 28°C. Si on pose Abidjan comme 0, Korhogo est à -10. En comptabilité du gérant de cabine MTN, -5000F = dette, +10000F = bénéfice. Les nombres relatifs expriment dettes, températures, altitudes sous niveau de la mer (Assinie).

## Définitions
- Nombre relatif: signe (+/-) + distance à zéro (valeur absolue). Ex: -3, +5.2
- Opposés: même distance, signes contraires. Opposite de +3 = -3
- Valeur absolue: |-5|=5
- Axe gradué: droite avec origine O.

## Formules
- Addition: (+a)+(+b)=+(a+b) ; (-a)+(-b)=-(a+b) ; signes contraires: soustraire valeurs absolues, signe du plus grand en valeur absolue. Ex: -7+4=-(7-4)=-3
- Soustraction: a - b = a + (-b)
- Distance entre x et y: |x - y|
- Règle des signes produit: +*+=+, -*-=+, +-=-, -+=-

## Schéma
Thermomètre vertical avec 0 au milieu, +10 en haut, -5 en bas. Droite graduée -6 à +6 avec points A(-4), B(+2).

## Exemples résolus
Ex1: -8 + 5 = -3
Ex2: -3 - (-7) = -3+7=4
Ex3: Calcule (+12)+(-15)+(+5)+(-2)=12-15+5-2=0
Ex4: Température: matin -2°C à Man, après-midi +5°C de plus. Quelle température? -2+5=3°C

## Exercices corrigés
Ex1: Effectue -12+7-5+10 = (-12-5)+(7+10)= -17+17=0
Ex2: Trouve x: x + (-8) = -3 => x=5 car 5-8=-3
Ex3: Range: -3.5, 0, -1, 2.2, -0.5 => -3.5<-1<-0.5<0<2.2
Ex4: Un commerçant à Adjamé: solde début -20000F (dette), vente +35000F, achat -15000F. Solde final? -20000+35000-15000=0F

## Astuce
Pour addition, imagine ton compte Orange Money: débit = -, crédit = +. Si tu dois 3000 et on te donne 5000, il te reste +2000. Retenir: soustraire un négatif = ajouter.`,id:258,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Triangles - Propriétés et constructions",niveau:"5e",matiere:"Mathématiques",chapitre:"Triangles",contenu:`# Introduction ivoirienne
Le toit d'une case à Yamoussoukro forme un triangle pour évacuer l'eau de pluie. Le support du pont HKB est triangulé pour être solide. Triangles partout.

## Définitions
- Triangle: 3 côtés, 3 sommets, 3 angles somme 180°
- Types selon côtés: scalène (aucun égal), isocèle (2 égaux), équilatéral (3 égaux, 60° chacun)
- Types selon angles: rectangle (1 angle 90°), acutangle (tous <90°), obtusangle (1 >90°)
- Droites remarquables: médiatrice (perpendiculaire milieu), médiane (sommet-milieu opposé), hauteur (perpendiculaire sommet-côté), bissectrice (coupe angle en 2)

## Formules
- Somme angles: A+B+C=180°
- Périmètre: P=AB+BC+CA
- Aire: A = (base * hauteur)/2
- Inégalité triangulaire: AB < AC+CB (un côté < somme des 2 autres). Condition existence.
- Pythagore (triangle rectangle en A): BC² = AB²+AC²

## Schéma
Triangle ABC avec notations, hauteur issue de A sur BC, médiatrice de AB. Triangle rectangle avec angle droit marqué, isocèle avec 2 marques égales.

## Exemples résolus
Ex1: Un triangle a 2 angles 50° et 60°, 3e? 180-110=70°
Ex2: Construire triangle AB=5cm, AC=4cm, BC=6cm au compas. Vérifier inégalité: 5<4+6 ok.
Ex3: Aire: base 8cm, hauteur 3cm => A=8*3/2=12cm²
Ex4: Triangle isocèle en A, angle A=40°, angles base? (180-40)/2=70° chacun

## Exercices corrigés
Ex1: Peut-on construire triangle 2,3,7? Non car 7>2+3=5
Ex2: Triangle rectangle isocèle, angle droit 90°, autres? 45° chacun
Ex3: Construis triangle équilatéral côté 5cm. Quelle est chaque angle? 60°
Ex4: Périmètre champ triangulaire côtés 120m, 80m, 100m => 300m. Si clôture à 1500F/m, coût? 450000F

## Astuce
Toujours dessiner à main levée d'abord et coder les infos. Pour somme angles, pense à découper un triangle papier et aligner les 3 coins: ils font une ligne droite (180°).`,id:259,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Proportionnalité - Pourcentage, échelle, vitesse",niveau:"5e",matiere:"Mathématiques",chapitre:"Proportionnalité",contenu:`# Introduction ivoirienne
1 kg d'igname à Bouaké = 400F, 3 kg = 1200F. C'est proportionnel. La carte de Côte d'Ivoire à l'école: 1 cm = 10 km. La vitesse du bus Abidjan-Yamoussoukro 80 km/h. Proportionnalité quotidienne.

## Définitions
- Grandeurs proportionnelles: y = k*x, k coefficient.
- Tableau de proportionnalité: colonnes proportionnelles, produits en croix égaux.
- Pourcentage: fraction sur 100. t% de N = t/100 * N
- Échelle: échelle = distance carte / distance réelle. 1/50000 signifie 1cm carte =50000cm réel =500m
- Vitesse moyenne: v = distance / temps

## Formules
- Produit en croix: si a/b = c/d alors a*d = b*c
- Quatrième proportionnelle: x = b*c / a
- Pourcentage: p = (partie/totale)*100
- Échelle: Dréelle = Dcarte / échelle
- Vitesse: v(km/h)= d(km)/t(h), d=v*t, t=d/v ; 1 m/s =3.6 km/h

## Schéma
Tableau 2 lignes avec flèches *k. Graphique droite passant par origine pour situation proportionnelle. Carte avec segment 1cm légendé.

## Exemples résolus
Ex1: 5 cahiers 2500F, prix 8 cahiers? k=500F/cahier => 4000F. Ou 8*2500/5=4000
Ex2: 20% de 15000F remise sur pagne? 0.20*15000=3000F, prix payé 12000F
Ex3: Carte 1/200000, distance carte 3cm => réelle 3*200000=600000cm=6km
Ex4: Bus fait 240km en 3h => v=80km/h

## Exercices corrigés
Ex1: Recette garba: 2 personnes 300g attiéké, 5 personnes? 750g. Solution 5*300/2=750
Ex2: Éleveur: 12 poulets mangent 3kg/jour, 20 poulets? 5kg (3*20/12)
Ex3: Augmentation loyer de 50000 à 55000 => %? (5000/50000)*100=10%
Ex4: Course: Kouassi court 100m en 20s, vitesse? 5m/s =18km/h

## Astuce BEPC
Reconnaître proportionnalité: si double => double. Pourcentage: trouve 1% d'abord (divise par 100) puis multiplie. Échelle: convertis toujours en même unité (cm).`,id:260,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Statistiques - Collecte et diagrammes",niveau:"5e",matiere:"Mathématiques",chapitre:"Statistiques",contenu:`# Introduction ivoirienne
Le professeur de 5e au collège moderne de Daloa relève les notes de maths: 12, 9, 15, 8... Comment trouver la moyenne de la classe? La coopérative de cacao compte production par planteur. Statistiques = organiser données.

## Définitions
- Population, individu, caractère (qualitatif/quantitatif), effectif, fréquence, classe
- Moyenne: somme / effectif total
- Médiane: valeur milieu après tri
- Étendue: max - min
- Fréquence: f = effectif / total, en % f*100

## Formules
- Moyenne pondérée: m = (n1*x1 + n2*x2 + ...)/N
- Fréquence: fi = ni / N
- Fréquence cumulée croissante: somme des fréquences jusqu'à cette valeur

## Schéma
Tableau effectifs, histogramme (barres), diagramme circulaire (camembert) pour répartition ethnies, polygone.

## Exemples résolus
Ex1: Notes: 8,10,12,12,15 => moyenne (8+10+12+12+15)/5=57/5=11.4 ; médiane 12 ; étendue 7
Ex2: 30 élèves, 12 aiment football => fréquence 12/30=0.4=40%
Ex3: Production cacao (t): 20 planteurs: 5 (1t),10 (2t),5 (3t) => moyenne (5*1+10*2+5*3)/20=2t

## Exercices corrigés
Ex1: Relevé tailles (cm) 150,155,150,160,155,150. Effectifs: 150:3,155:2,160:1. N=6. Fréquence 150=50%. Moyenne 152.5cm
Ex2: Diagramme circulaire: 120 élèves, 30 en 5eA = 90°? Angle =30/120*360=90°
Ex3: Moyennes trimestrielles 5e: 10, 12.5, 9.5 => moyenne annuelle 10.66

## Astuce
Toujours vérifier total N = somme effectifs. Pour médiane impaire, valeur centrale; paire, moyenne des deux centrales. Utilise tableau bien ordonné.`,id:261,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Grammaire - Classes et analyse grammaticale",niveau:"5e",matiere:"Français",chapitre:"Grammaire",contenu:`# Introduction ivoirienne
Aïcha dit: "Les enfants d'Abobo vendent des mangues." Chaque mot a une nature. Comme au marché, chaque produit a sa place, chaque mot a sa classe grammaticale.

## Définitions - Programme CI 5e
- 9 classes variables: nom, déterminant, adjectif qualificatif, pronom, verbe
- 4 invariables: adverbe, préposition, conjonction (coordination/subordination), interjection
- Analyse grammaticale: nature + fonction
- Groupe nominal: Dét + (Adj) + Nom + (compléments)

## Formules/Règles
- Accord adjectif: s'accorde en genre/nombre avec nom: petite mangue, petits garçons
- Accord verbe avec sujet: Les enfants jouent (pluriel)
- Nature vs fonction: Nature = carte d'identité fixe (ex: nom). Fonction = rôle dans phrase (sujet, COD...)

## Schéma
Phrase: [Les jeunes filles] (GN sujet) [d'Abidjan] (compl) [portent joyeusement] (verbe+adv) [des pagnes colorés] (COD)

## Exemples résolus
Ex1: "Le vieux pêcheur rentre." Le: déterminant article défini, masc sing, détermine pêcheur. vieux: adj qual, épithète de pêcheur. pêcheur: nom commun masc sing, sujet de rentre. rentre: verbe rentrer 3e pers sing présent.
Ex2: "Il mange rapidement." Il pronom perso sujet, mange verbe transitif, rapidement adverbe manière

## Exercices corrigés
Ex1: Analyse "Ces trois ananas sucrés coûtent cher." Ces: dét dém pl, trois: dét num/card, ananas: nom masc pl sujet, sucrés: adj épithète accord pl, coûtent: verbe coûter, cher: adv
Ex2: Donne nature: sous (préposition), et (conj coord), très (adv)
Ex3: Trouve GN: "Le grand marché de Treichville" -> Dét Le + Adj grand + Nom marché + Compl de Treichville

## Astuce
Question: "C'est quoi?" => nature. "Ça sert à quoi dans la phrase?" => fonction. Pour classes, remplace par un autre mot de même famille.`,id:262,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Fonctions grammaticales - Sujet, COD, CCL",niveau:"5e",matiere:"Français",chapitre:"Fonction",contenu:`# Introduction ivoirienne
"Marie vend du poisson au marché le matin." Qui vend? Marie (sujet). Quoi? du poisson (COD). Où? au marché (CCL). Quand? le matin (CCT). Les fonctions expliquent le rôle.

## Définitions
- Sujet: fait l'action, s'accorde avec verbe. Qui? Qu'est-ce qui?
- COD (Complément d'Objet Direct): direct sans préposition, répond Quoi? Qui? Ex: Il mange l'attiéké
- COI: avec préposition à/de: Il parle à son père
- CCL: lieu (où?), CCT temps (quand?), CCM manière (comment?), CC cause, but
- Attribut du sujet: après verbe d'état (être, paraître, devenir): Il est courageux
- Complément du nom: de l'ile, en bois

## Règles
- Pour trouver COD: pose Quoi? après verbe. Ex: Je vois (quoi?) les élèves.
- COI: À qui? De quoi?
- CC supprimable et déplaçable: Je vais au champ demain => Demain, je vais au champ
- Attribut s'accorde avec sujet

## Schéma
Phrase découpée: Sujet | Verbe | COD | CCL | CCT

## Exemples résolus
"Kofi cultive du cacao à Daloa depuis trois ans."
- Kofi: sujet
- cultive: verbe
- du cacao: COD (quoi?)
- à Daloa: CCL (où?)
- depuis trois ans: CCT (depuis quand?)

## Exercices corrigés
Ex1: "Les élèves écoutent attentivement le professeur." Sujet: Les élèves, COD: le professeur, CCM: attentivement
Ex2: "Elle est devenue présidente." présidente = attribut du sujet Elle (verbe d'état devenir)
Ex3: "Le sac de riz est tombé." de riz = complément du nom sac
Ex4: Transforme en question COD: "Il achète des ignames" -> Qu'achète-t-il? Des ignames = COD

## Astuce BEPC
Méthode QQOQCCP: Qui? Quoi? Où? Quand? Comment? Combien? Pourquoi? Ça donne toutes les fonctions. Ne confonds pas COD et attribut: attribut avec être/sembler.`,id:263,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Le Passé simple - Formation et emplois",niveau:"5e",matiere:"Français",chapitre:"Passé simple",contenu:`# Introduction ivoirienne
Nos grands-mères à Bouaké racontent: "Il était une fois... Le chasseur partit tôt, il vit un lion et s'enfuit." Conte, récit historique = passé simple pour actions brèves passées.

## Définitions - Programme CI 5e
- Temps du récit, narration écrite, actions de premier plan, ponctuelles, successives
- Opposition imparfait (arrière-plan, durée) / passé simple (premier plan)

## Formules - Conjugaison
- -er: je -ai, tu -as, il -a, nous -âmes, vous -âtes, ils -èrent (chanter: je chantai)
- -ir: -is, -is, -it, -îmes, -îtes, -irent (finir: je finis)
- -re/-oir: -is/-us: je vendis, je reçus, je fis, je vis
- Être: je fus, tu fus, il fut, nous fûmes, vous fûtes, ils furent
- Avoir: j'eus, tu eus, il eut, nous eûmes, vous eûtes, ils eurent
- Irréguliers: aller: j'allai, venir: je vins, prendre: je pris, voir: je vis, dire: je dis

## Schéma
Frise: Imparfait = ligne continue (il faisait chaud), Passé simple = points (il partit, il arriva)

## Exemples résolus
Texte: "Il faisait nuit (imp), le vent soufflait (imp). Soudain, un bruit retentit (PS), les enfants sursautèrent (PS)."
Ex: Conjugue "Le héros (prendre) son arc et (partir)". => prit, partit
Ex: "Nous (être) à Abidjan et nous (voir) le président." => fûmes, vîmes

## Exercices corrigés
Ex1: Mets au PS: "Je (manger) et (boire)" => je mangeai et bus
Ex2: Distingue: "Il pleuvait quand il sortit" => pleuvait=imp durée, sortit=PS action brève
Ex3: Conte: "Le roi (convoquer) ... Les guerriers (arriver) ... Il (parler) ..." => convoqua, arrivèrent, parla
Ex4: Réécris présent au PS: "Il prend son vélo, va au marché" => Il prit son vélo, alla au marché

## Astuce
PS = lettres i, u, in, a. Pour 1re pers sing en -er, -ai (pas -ais!). Pour ne pas confondre imparfait/passé simple: PS souvent avec "soudain, alors, puis, enfin".`,id:264,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Le Récit - Schéma narratif et types",niveau:"5e",matiere:"Français",chapitre:"Récit",contenu:`# Introduction ivoirienne
Le récit de Soundjata Keïta, de la reine Abla Pokou, les histoires d'Anansi l'araignée racontées sous l'arbre à palabres: tout récit a une structure.

## Définitions
- Récit: suite d'événements avec personnages, lieu, temps
- Schéma narratif en 5 étapes: 1 Situation initiale (équilibre), 2 Élément perturbateur, 3 Péripéties (actions), 4 Dénouement (résolution), 5 Situation finale (nouvel équilibre)
- Schéma actantiel: héros, adjuvants (aident), opposants (bloquent), quête
- Types: conte (merveilleux), nouvelle (court), roman (long), mythe, légende
- Narrateur: interne (je), externe (il), omniscient (sait tout)

## Formules - Structure
- Situation initiale: imparfait description
- Élément déclencheur: soudain, un jour, passé simple
- Péripéties: PS + imparfait, connecteurs logiques (puis, ensuite, cependant)
- Dénouement: enfin, finalement
- Situation finale: morale

## Schéma
Pyramide narrative: montée tension jusqu'au climax puis descente.

## Exemples résolus
Exemple Abla Pokou: SI: Peuple en paix au bord du fleuve (imp) ; EP: Fleuve en crue barrière ; Péripéties: Reine consulte devin, doit sacrifier enfant ; Dénouement: Elle jette son fils, eau baisse ; SF: Peuple sauvé fonde Baoulé, cri "Ba li" (l'enfant est mort). Morale sacrifice.

## Exercices corrigés
Ex1: Découpe ce récit en 5 étapes: "Kouamé vivait heureux... Un jour son champ brûla... Il chercha aide... Il retrouva travail... Il vécut mieux." => SI vivait heureux, EP champ brûla, Périp chercha aide, D retrouv travail, SF vécut mieux
Ex2: Identifie adjuvants/opposants dans conte Anansi: Anansi héros, araignée adjuvant ruse, fermier opposant
Ex3: Écris situation initiale conte ivoirien 3 phrases imparfait: "Il était une fois à Korhogo..."

## Astuce
Pour rédiger, respecte les 5 étapes, utilise temps du récit (imp + PS), ajoute dialogue, description ivoirienne (pagne, forêt, savane), termine par morale "C'est pourquoi on dit...".`,id:265,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Empire Songhaï - Apogée et déclin",niveau:"5e",matiere:"Histoire-Géographie",chapitre:"Empire Songhaï",contenu:`# Introduction ivoirienne

Côte d'Ivoire 29 millions habitants 2024, Abidjan 6M. Pourquoi population augmente vite? Pourquoi tous viennent à Abidjan? Exode rural.

## Définitions
- Démographie: étude population
- Croissance naturelle = natalité - mortalité ; Accroissement = natalité - mortalité + solde migratoire
- Transition démographique: Afrique encore phase 2 (forte natalité, mortalité baisse) => explosion
- Densité = habitants / km². CI densité ~ 82 hab/km² mais Abidjan > 2000

- Structure: jeune (45% <15 ans), pyramide à base large
- Problèmes: chômage jeunes, bidonvilles (Abobo, Yop), besoin écoles, santé

## Formules
- Taux natalité = naissances / pop totale *1000 (‰)
- Densité = Population / Superficie
- % urbain = pop urbaine / totale *100

## Schéma
Pyramide âges CI base large, sommet pointu. Carte densité CI: forte Sud littoral et centre, faible Nord. Graphique croissance 1960-2025 courbe forte.

## Exemples résolus
CI 322 462 km², 29M => densité 90 hab/km². Mais District Abidjan 2119km², 6,3M => 2973 hab/km². Écart montre macro-céphalie.

Ex2: Conséquences exode rural? Départ bras valides, bidonvilles villes, vieillissement village

À la puberté en 5e (11-13 ans), corps change: voix, poitrine, règles. Pourquoi? Reproduction assure suite espèce. En Côte d'Ivoire, parler puberté important pour éviter grossesses précoces.

## Définitions - Programme CI 5e
- Puberté: transformations physiques, physiologiques, comportement dues hormones (testostérone garçons, oestrogènes filles) : 10-15 ans
- Appareil reproducteur garçon: testicules (fabriquent spermatozoïdes + testostérone), épididyme, canal déférent, prostate, pénis
- Fille: ovaires (ovules + oestrogènes), trompes, utérus, vagin, vulve, règles (menstruations) = écoulement muqueuse utérine si pas fécondation (~28j cycle)
- Gamètes: spermatozoïde (mobile, 60 millions/éjaculation) et ovule (gros, 1/mois)
- Fécondation: fusion sperm + ovule dans trompe => zygote => division => embryon => foetus dans utérus 9 mois, accouchement
- IST, VIH: transmission sexuelle, protection préservatif, abstinence

## Schéma
Schémas légendés appareils garçon/fille face et coupe, cycle ovarien avec ovulation J14, règles J1-5. Schéma fécondation rencontre.

## Formules/Étapes
- Cycle 28j: J1 règles, J14 ovulation (libération ovule), phase lutéale, si pas fécondation J28 règles
- Fécondation: 1 sperm + 1 ovule = 46 chromosomes

## Exemples résolus
Ex: Explique pourquoi règles: Utérus prépare nid riche vaisseaux, si pas bébé, muqueuse se détache sang.
Ex: Jumeaux: vrais (1 ovule divisé) vs faux (2 ovules)

## Exercices corrigés
Ex1: Légende schéma ovule et spermatozoïde. Corrigé list
Ex2: Cite 3 changements puberté garçon/fille. Garçon voix grave, poils, muscle; fille poitrine, hanches, règles
Ex3: Où se fait fécondation? Trompe. Où se développe embryon? Utérus
Ex4: Propose 3 conseils éviter IST/grossesse précoce: abstinence, préservatif, dialogue parents, éviter écrans porno, concentration études

## Astuce BEPC
Toujours vocabulaire scientifique précis, pas vulgaire. Pour cycle, dessine axe temps J1 à J28. Hygiène puberté: lavage quotidien, sous-vêtements coton. Révision: hormones = messagers chimiques.`,id:269,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Circulation sanguine et respiration",niveau:"5e",matiere:"SVT",chapitre:"Circulation",contenu:`# Introduction ivoirienne
Quand Kouadio court au stade d'Ebimpe, son cœur bat vite, il respire fort. Sang transporte oxygène des poumons vers muscles, comme gbaka transporte passagers.

## Définitions
- Sang: plasma (liquide), globules rouges (hémoglobine transporte O2/CO2), globules blancs (défense), plaquettes (coagulation)
- Cœur: 4 cavités (2 oreillettes, 2 ventricules), pompe double, cloison étanche, bat 70/min
- Vaisseaux: artères (cœur->organes, sang rouge O2 sauf artère pulmonaire), veines (organes->cœur, sang bleu CO2 sauf veine pulmonaire), capillaires (échanges)
- Circulation: petite (cœur-poumons: sang récupère O2) et grande (cœur-organes: distribue O2)
- Respiration: poumons, alvéoles échanges O2/CO2, inspiration/diastole, expiration/systole
- Maladies: drépanocytose fréquente CI (globules faucille), anémie, hypertension

## Formules/Schéma
Schéma cœur coupe avec flèches: VD -> artère pulmonaire -> poumons -> veines pulmonaires -> OG -> VG -> aorte -> organes -> veines caves -> OD
Équation échange: Au poumon: sang CO2 + O2 air => sang O2 + CO2 expiré. Au muscle: sang O2 + nutriments -> énergie + CO2 + déchets

## Exemples résolus
Pourquoi sang artère rouge vif, veine rouge sombre? Hémoglobine oxygénée vs désoxygénée.
Trajet globule rouge pied -> poumon: veine jambe -> veine cave inférieure -> OD -> VD -> artère pulmonaire -> poumon

## Exercices corrigés
Ex1: Légende cœur avec 4 cavités, aorte, veines caves. Corrigé: OD en haut droite etc
Ex2: Explique rôle valve: évite retour sang
Ex3: Pendant effort, pourquoi fréquence cardiaque augmente? Muscle besoin plus O2
Ex4: Dangers tabac: goudron bouche alvéoles, CO prend place O2

## Astuce
Retiens artère = quitte cœur, A comme Aller. Veine = Vient vers cœur. Petite circulation = Poumons = Purifie. Hémoglobine = taxi O2. Pour BEPC, colorie schéma rouge O2, bleu CO2.`,id:270,status:"generated",progress:100,agent:"Content Forge Real"},{titre:"Atomes - Structure, molécules, ions",niveau:"5e",matiere:"Physique-Chimie",chapitre:"Atomes",contenu:`# Introduction ivoirienne
Matière qui compose pagne, eau de lagune, air d'Abidjan: tout fait d'atomes minuscules invisibles, comme sable fin mais 10^-10 m. Comment sont-ils?

## Définitions - Programme CI 5e
- Atome: noyau (protons + positifs, neutrons neutres) + électrons - négatifs qui tournent (nuage). Taille ~10^-10m, noyau 10000x plus petit
- Numéro atomique Z = nombre protons = nombre électrons atome neutre
- Modèle: Z protons, A = Z+neutrons = nombre masse
- Symbole chimique: H (Z1), O (Z8), C, Fe, Al, Na
- Molécule: assemblage 2+ atomes liés: H2O (2H+1O), CO2, O2, CH4 (gaz cuisine)
- Corps pur simple (1 atome: O2) vs composé (plusieurs types)
- Ion: atome ayant perdu ou gagné électron(s): Na+ (perdu 1e-), Cl- (gagné 1e-), équilibre électrique rompu

## Formules
- Atome neutre: nb p+ = nb e-
- Masse atome concentrée dans noyau, électrons masse négligeable
- Formule ion: Na -> Na+ + e- ; Cl + e- -> Cl-

## Schéma
Schéma atome avec noyau central protons/neutrons, 1ère couche K (2e-), L (8e-). Molécule eau en V, angle 104°, O gros rouge, H blancs petits. Cristal sel Na+ Cl- alternés.

## Exemples résolus
Ex1: Oxygène Z=8, combien électrons? 8. Répartition: K 2, L 6 donc cherche 2 liaisons
Ex2: Eau H2O: 2 atomes H Z1 + 1 O Z8 => total protons 1+1+8=10
Ex3: Na Z11: perd 1 e- devient Na+ 10 e-, stable.

## Exercices corrigés
Ex1: Atome Carbone Z6, A12: combien neutrons? A-Z=6 neutrons, 6 électrons
Ex2: Donne symboles: eau H2O, dioxyde carbone CO2 (respire), sel NaCl
Ex3: Pourquoi O2 est molécule? 2 atomes même élément liés
